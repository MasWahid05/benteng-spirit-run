<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Pendaftaran Benteng Spirit Run</title>
<meta name="description" content="Pendaftaran online lomba atletik Benteng Spirit Run — PASI Kota Tangerang. Daftar perorangan, kolektif per klub/sekolah, atau tim estafet.">
<meta property="og:title" content="Pendaftaran Benteng Spirit Run">
<meta property="og:description" content="Daftar lomba lari anak & pelajar: perorangan, kolektif klub/sekolah, dan estafet. Unggah bukti bayar langsung.">
<meta name="theme-color" content="#0f6b3a">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%230f6b3a'/%3E%3Cpath d='M7 22h4l3-9 4 11 3-7h4' fill='none' stroke='%23f5c400' stroke-width='3' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/app.css?v=6">
<style>
  body{background:var(--bg)}
  .hero{position:relative;overflow:hidden;background:linear-gradient(160deg,#0f6b3a 0%,#0b5530 70%);color:#fff;padding:40px 16px 90px}
  .hero::after{content:"";position:absolute;left:-5%;right:-5%;bottom:-2px;height:70px;background:var(--bg);border-radius:50% 50% 0 0/100% 100% 0 0}
  .hero .lanes{position:absolute;inset:auto 0 60px 0;height:44px;background:repeating-linear-gradient(0deg,rgb(255 255 255/.14) 0 2px,transparent 2px 11px);transform:skewX(-30deg);opacity:.7}
  .hero-in{width:min(760px,100%);margin:auto;position:relative;z-index:1}
  .hero .eyebrow{display:inline-flex;gap:8px;align-items:center;background:rgb(255 255 255/.12);border:1px solid rgb(255 255 255/.2);padding:5px 12px;border-radius:999px;font-size:.78rem;font-weight:700;letter-spacing:.04em}
  .hero h1{font-size:clamp(1.9rem,5vw + .5rem,3rem);margin:14px 0 8px;color:#fff;letter-spacing:-.02em}
  .hero h1 span{color:var(--accent)}
  .hero p{color:rgb(255 255 255/.85);margin:0}
  .facts{display:flex;flex-wrap:wrap;gap:10px;margin-top:18px}
  .facts div{background:rgb(255 255 255/.1);border:1px solid rgb(255 255 255/.18);border-radius:12px;padding:8px 12px;font-size:.85rem}
  .facts b{display:block;font-size:.95rem}
  .wrapf{width:min(760px,100% - 24px);margin:-60px auto 40px;position:relative;z-index:2}
  .tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:6px;box-shadow:var(--shadow)}
  .tabs button{border:0;background:none;border-radius:10px;padding:10px 6px;font-weight:800;cursor:pointer;color:var(--muted);font-size:.88rem;line-height:1.2}
  .tabs button small{display:block;font-weight:600;font-size:.72rem;margin-top:2px}
  .tabs button[aria-selected="true"]{background:var(--brand);color:var(--on-brand)}
  .formcard{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:22px;margin-top:14px;box-shadow:var(--shadow)}
  .formcard h2{font-size:1.15rem}
  .sec{font-size:.75rem;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--brand);margin:18px 0 10px;display:flex;align-items:center;gap:10px}
  .sec::after{content:"";flex:1;height:1px;background:var(--line)}
  .chips{display:flex;flex-wrap:wrap;gap:8px}
  .chip{position:relative}
  .chip input{position:absolute;opacity:0;inset:0;cursor:pointer}
  .chip span{display:inline-flex;align-items:center;min-height:40px;padding:0 14px;border-radius:999px;border:1.5px solid var(--line);font-weight:700;font-size:.86rem;background:var(--surface);transition:.15s}
  .chip input:checked+span{background:var(--brand-soft);border-color:var(--brand);color:var(--brand)}
  .chip input:focus-visible+span{outline:3px solid color-mix(in srgb,var(--brand) 60%,transparent);outline-offset:2px}
  .drop{display:flex;align-items:center;gap:14px;border:2px dashed var(--line);border-radius:14px;padding:16px;cursor:pointer;background:var(--surface-2);transition:.15s}
  .drop:hover,.drop.over{border-color:var(--brand);background:var(--brand-soft)}
  .drop svg{width:28px;height:28px;color:var(--brand);flex:none}
  .drop img{width:64px;height:64px;object-fit:cover;border-radius:10px}
  .total{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;background:var(--brand-soft);border-radius:14px;padding:14px 16px;margin-top:16px}
  .total b{font-size:1.25rem}
  .rowk{border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:10px;position:relative;background:var(--surface-2)}
  .rowk .no{position:absolute;top:-10px;left:12px;background:var(--brand);color:var(--on-brand);font-weight:800;font-size:.72rem;padding:2px 9px;border-radius:999px}
  .rowk .del{position:absolute;top:8px;right:8px}
  .done{text-align:center;padding:30px 10px}
  .done .ok{width:72px;height:72px;border-radius:50%;background:var(--ok-bg);color:var(--ok);display:grid;place-items:center;margin:0 auto 14px}
  .done .ok svg{width:38px;height:38px}
  footer{text-align:center;color:var(--muted);font-size:.8rem;padding:0 16px 30px}
  .err{color:var(--bad);font-size:.8rem;font-weight:700}
</style>
</head>
<body>
<header class="hero">
  <div class="lanes" aria-hidden="true"></div>
  <div class="hero-in">
    <span class="eyebrow" id="h-org">PASI Kota Tangerang</span>
    <h1 id="h-nama">BENTENG SPIRIT <span>RUN</span></h1>
    <p>Lomba lari untuk TK, SD, SMP & SMA. Daftar online, unggah bukti bayar, nomor dada diumumkan setelah pembayaran divalidasi panitia.</p>
    <div class="facts" id="facts"></div>
  </div>
</header>

<main class="wrapf">
  <div class="tabs" role="tablist" aria-label="Jenis pendaftaran">
    <button role="tab" aria-selected="true" data-tab="perorangan">Perorangan<small>1 atlet</small></button>
    <button role="tab" aria-selected="false" data-tab="kolektif">Kolektif<small>klub / sekolah</small></button>
    <button role="tab" aria-selected="false" data-tab="estafet">Estafet<small>tim 4 pelari</small></button>
  </div>
  <div id="note-top"></div>
  <section class="formcard" id="panel"></section>
</main>
<footer>Data pribadi (NIK & nomor HP) hanya dipakai panitia untuk verifikasi peserta. • <a href="index.html">Panel panitia</a></footer>

<div id="toasts" class="toasts" aria-live="polite"></div>
<div id="loading" class="loading hidden" role="alert"><div style="text-align:center"><div class="spinner" style="margin:auto"></div><p id="loading-msg">Mengirim…</p></div></div>

<script src="assets/config.js?v=6"></script>
<script src="assets/api.js?v=6"></script>
<script src="assets/daftar.js?v=6"></script>
</body>
</html>
